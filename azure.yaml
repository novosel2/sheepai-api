# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: sheepai
metadata:
    template: azd-init@1.25.0
services:
    sheepai-api:
        project: src/SheepAI.API
        host: containerapp
        language: dotnet
resources:
    sheepai-redis:
        type: azure.redis
    sheepai-api:
        type: host.containerapp
        port: 8080
        uses:
            - sheepai-redis
